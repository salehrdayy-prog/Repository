name: Sky Forecast Bot

on:
  schedule:
    - cron: '0 */5 * * *' # هر ۵ ساعت یک بار استارت می‌زنه
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # حداکثر زمان اجرا رو ۵ ساعت و ۵۰ دقیقه تنظیم می‌کنیم
    concurrency: 
      group: bot-group
      cancel-in-progress: false # اجازه میده اجرای جدید توی صف بمونه تا قبلی تموم بشه

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
